<!DOCTYPE html>
<html lang="zh" data-theme="light" data-lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<title>SKU 路径查询</title>
<style>
/* ===== iOS 26 液态玻璃 · 全组件玻璃质感 ===== */
html[data-theme="light"]{
  --body-bg:#eef0f4;
  --text:#1d1d1f;
  --text-sub:#6e6e73;
  --text-faint:#9a9aa0;
  --glass:rgba(255,255,255,.58);
  --glass-soft:rgba(255,255,255,.42);
  --glass-border:rgba(255,255,255,.9);
  --glass-brd2:rgba(255,255,255,.5);
  --glass-hi:inset 0 1px 1px rgba(255,255,255,.95), inset 0 -1px 1px rgba(255,255,255,.35);
  --glass-shadow:0 10px 32px rgba(60,60,80,.12), 0 2px 6px rgba(60,60,80,.05);
  --btn-text:#1d1d1f;          /* 按钮文字(日) */
  --btn-primary-bg:#111; --btn-primary-text:#fff;
  --input-border:rgba(90,90,120,.14);
  --glow-bg:
    radial-gradient(640px 440px at 12% 4%, rgba(220,228,255,.55), transparent 62%),
    radial-gradient(540px 420px at 88% 10%, rgba(240,230,255,.5), transparent 60%),
    radial-gradient(640px 480px at 50% 100%, rgba(230,240,255,.55), transparent 62%),
    radial-gradient(480px 360px at 80% 55%, rgba(250,235,230,.4), transparent 60%);
}
html[data-theme="dark"]{
  --body-bg:#0a0a0c;
  --text:#f5f5f7;
  --text-sub:#a1a1a6;
  --text-faint:#6a6a70;
  --glass:rgba(24,24,30,.55);
  --glass-soft:rgba(24,24,30,.4);
  --glass-border:rgba(255,255,255,.18);
  --glass-brd2:rgba(255,255,255,.09);
  --glass-hi:inset 0 1px 1px rgba(255,255,255,.2), inset 0 -1px 1px rgba(255,255,255,.05);
  --glass-shadow:0 12px 40px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4);
  --btn-text:#ffffff;          /* 按钮文字(夜) — 强制白色 */
  --btn-primary-bg:#ffffff; --btn-primary-text:#000;
  --input-border:rgba(255,255,255,.18);
  --glow-bg:
    radial-gradient(640px 440px at 12% 4%, rgba(50,60,100,.42), transparent 62%),
    radial-gradient(540px 420px at 88% 10%, rgba(70,50,100,.38), transparent 60%),
    radial-gradient(640px 480px at 50% 100%, rgba(40,70,110,.45), transparent 62%),
    radial-gradient(480px 360px at 80% 55%, rgba(90,50,40,.3), transparent 60%);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  color:var(--text);background:var(--body-bg,#111);overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
/* 液态玻璃背景 */
.bg-fx{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--glow-bg);background-size:cover;animation:bgfloat 26s ease-in-out infinite alternate}
@keyframes bgfloat{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-1.5%,1%) scale(1.04)}}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;background-image:radial-gradient(rgba(255,255,255,.25) .5px, transparent .5px),radial-gradient(rgba(255,255,255,.18) .5px, transparent .5px);background-size:34px 34px,34px 34px;background-position:0 0,17px 17px;mix-blend-mode:overlay}
html[data-theme="dark"] body::after{opacity:.25}

/* 顶栏 */
.topbar{position:sticky;top:0;z-index:100;width:100%;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid var(--glass-brd2);box-shadow:var(--glass-hi),0 4px 20px rgba(0,0,0,.05)}
.topbar-title{font-size:17px;font-weight:600;letter-spacing:-.01em}
.controls{display:flex;gap:10px}
.ctl{display:flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);color:var(--text);border:1px solid var(--glass-border);box-shadow:var(--glass-hi),0 2px 10px rgba(0,0,0,.06);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .2s ease}
.ctl:hover{transform:translateY(-1px)}
.ctl:active{transform:scale(.96)}

/* 主体全宽 */
.main{position:relative;z-index:1;width:100%;padding:40px 32px 60px}
.hero{text-align:center;margin-bottom:34px}
.hero h1{font-size:40px;font-weight:700;letter-spacing:-.03em}
.hero .sub{font-size:15px;color:var(--text-sub);margin-top:10px}

/* 搜索玻璃 */
.search-wrap{max-width:580px;margin:0 auto 32px}
.searchbox{display:flex;align-items:center;padding:6px;border-radius:20px;background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--glass-border);box-shadow:var(--glass-hi),var(--glass-shadow)}
#q{flex:1;padding:15px 18px;font-size:16px;color:var(--text);background:transparent;border:none;outline:none;font-family:inherit}
#q::placeholder{color:var(--text-sub)}
button.search-btn{padding:12px 26px;border:none;border-radius:14px;cursor:pointer;font-size:15px;font-weight:600;background:var(--btn-primary-bg);color:var(--btn-primary-text);transition:transform .15s ease,opacity .2s;font-family:inherit}
button.search-btn:hover{opacity:.88}
button.search-btn:active{transform:scale(.95)}

.quick{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:26px}
.chip{font-size:13px;color:var(--text);padding:7px 18px;border-radius:999px;cursor:pointer;font-family:inherit;transition:all .18s ease;background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);border:1px solid var(--glass-border);box-shadow:var(--glass-hi)}
.chip:hover{transform:translateY(-1px)}

.stats{max-width:1280px;margin:0 auto 12px;display:flex;justify-content:space-between;color:var(--text-faint);font-size:12px}
.meta{margin-bottom:14px;color:var(--text-sub);font-size:13px;font-weight:500}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,350px),1fr));gap:16px;max-width:1400px;margin:0 auto}
.item{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--glass-border);box-shadow:var(--glass-hi),var(--glass-shadow);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:12px;transition:transform .2s ease,box-shadow .25s ease}
.item:hover{transform:translateY(-3px);box-shadow:var(--glass-hi),0 20px 48px rgba(0,0,0,.14)}
.item .name{font-weight:600;font-size:14.5px;word-break:break-all;display:flex;align-items:center;gap:8px;color:var(--text)}
.item .path{font-size:12px;color:var(--text-sub);word-break:break-all;margin-top:6px;font-family:Consolas,Menlo,monospace;line-height:1.5;border-left:2px solid var(--glass-brd2);padding-left:10px}
.tag{font-size:10.5px;padding:2px 10px;border-radius:999px;font-weight:600;flex-shrink:0;background:var(--glass-soft);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--glass-border);color:var(--text)}
.tag.dir{background:var(--btn-primary-bg);color:var(--btn-primary-text);border-color:transparent}

.actions{display:flex;gap:10px;margin-top:4px}
.actions button{flex:1;padding:11px 14px;font-size:13px;font-weight:600;border-radius:14px;border:1px solid var(--glass-border);cursor:pointer;font-family:inherit;position:relative;overflow:hidden;transition:all .2s ease;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);color:var(--btn-text);box-shadow:var(--glass-hi)}
html[data-theme="dark"] .actions button{border-color:rgba(255,255,255,.25)}
.actions button.primary{background:var(--btn-primary-bg);border-color:var(--btn-primary-bg);color:var(--btn-primary-text)}
.actions button:active{transform:scale(.95)}
.actions button.state-done{background:rgba(52,199,89,.85);border-color:transparent;color:#fff!important}
.actions button.state-busy{background:rgba(80,80,100,.8);border-color:transparent;color:#fff!important}
.actions button.state-err{background:rgba(255,69,58,.85);border-color:transparent;color:#fff!important}
.actions button .btntext{display:inline-block;transition:opacity .18s ease,transform .18s ease}
.actions button.fade-out .btntext{opacity:0;transform:translateY(4px)}
.actions button.fade-in .btntext{opacity:1;transform:translateY(0)}
@keyframes pulsePop{0%{transform:scale(1)}40%{transform:scale(1.1)}100%{transform:scale(1)}}
.actions button.pulse-pop{animation:pulsePop .4s ease}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{display:inline-block;width:11px;height:11px;border:2px solid rgba(128,128,128,.4);border-top-color:var(--text);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-1px;margin-right:5px}

.empty{margin:0 auto;max-width:1400px;padding:52px 20px;text-align:center;color:var(--text-faint);font-size:15px;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%);border:1px dashed var(--glass-brd2);border-radius:22px;box-shadow:var(--glass-hi)}

.tip{max-width:1280px;margin:30px auto 0;font-size:12.5px;color:var(--text-sub);line-height:1.8;padding:18px 22px;border-radius:18px;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%);border:1px solid var(--glass-border);box-shadow:var(--glass-hi)}
.tip b{color:var(--text)}
.footer{text-align:center;margin-top:32px;color:var(--text-faint);font-size:11px;letter-spacing:.05em}

@media(max-width:600px){.main{padding:26px 16px 44px}.hero h1{font-size:28px}.topbar{padding:14px 16px}.results{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="bg-fx"></div>
<div class="topbar">
  <div class="topbar-title" data-zh="SKU 路径查询" data-en="SKU Path Search">SKU 路径查询</div>
  <div class="controls">
    <button class="ctl" id="themeBtn"><span id="themeIcon">🌙</span><span class="ctl-label" data-zh="深色" data-en="Dark">深色</span></button>
    <button class="ctl" id="langBtn"><span id="langLabel">English</span></button>
  </div>
</div>

<div class="main">
  <div class="hero">
    <h1 data-zh="在共享盘中快速定位文件" data-en="Locate files in the shared drive">在共享盘中快速定位文件</h1>
    <div class="sub" data-zh="输入 SKU / 编号 / 别名 / 关键词，关联结果一键定位" data-en="Enter SKU / code / alias / keyword to locate related folders">输入 SKU / 编号 / 别名 / 关键词，关联结果一键定位</div>
  </div>

  <div class="search-wrap">
    <div class="searchbox">
      <input id="q" data-zh="输入 SKU / 编号 / 别名，如 3012 或 RHL1000" data-en="Enter SKU / code / alias, e.g. 3012 or RHL1000" placeholder="输入 SKU / 编号 / 别名，如 3012 或 RHL1000" autofocus>
      <button class="search-btn" onclick="doSearch()"><span data-zh="搜索" data-en="Search">搜索</span></button>
    </div>
  </div>
  <div class="quick">
    <button class="chip" onclick="setQ('3012')">3012</button>
    <button class="chip" onclick="setQ('RHL1000')">RHL1000</button>
    <button class="chip" onclick="setQ('170035')">170035</button>
    <button class="chip" onclick="setQ('头盔')"><span data-zh="头盔" data-en="Helmet">头盔</span></button>
  </div>

  <div class="stats"><span id="count"></span><span id="built"></span></div>
  <div class="meta" id="meta"></div>
  <div class="results" id="results"></div>

  <div class="tip">
    <b data-zh="使用说明： " data-en="How to use: ">使用说明： </b>
    <span data-zh="支持 SKU 前缀匹配（搜 3012 → 列出 30120141、30120128 等全部关联文件夹）。点击「复制」复制 UNC 路径；点击「打开」在电脑上打开（首次需安装打开脚本）。" data-en="Supports SKU prefix matching (3012 lists 30120141, 30120128, etc.). Copy copies the UNC path; Open opens it (install opener once).">支持 SKU 前缀匹配（搜 3012 → 列出 30120141、30120128 等全部关联文件夹）。点击「复制」复制 UNC 路径；点击「打开」在电脑上打开（首次需安装打开脚本）。</span>
  </div>
  <div class="footer"><span data-zh="亚马逊共享盘 · SKU 查询工具" data-en="Amazon Shared Drive · SKU Search Tool">亚马逊共享盘 · SKU 查询工具</span></div>
</div>

<script>
let INDEX=null, lang='zh';
const el={q:document.getElementById('q'),count:document.getElementById('count'),built:document.getElementById('built'),meta:document.getElementById('meta'),results:document.getElementById('results')};
el.q.addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});
function setQ(v){el.q.value=v;doSearch();}

function applyLang(){
  lang=document.documentElement.getAttribute('data-lang')||'zh';
  document.documentElement.setAttribute('lang',lang);
  document.querySelectorAll('[data-zh]').forEach(e=>{const k=lang==='zh'?'data-zh':'data-en';const v=e.getAttribute(k);if(v!=null&&v!=='')e.textContent=v;});
  document.getElementById('langLabel').textContent=lang==='zh'?'EN':'中文';
  el.q.setAttribute('placeholder',lang==='zh'?'输入 SKU / 编号 / 别名，如 3012 或 RHL1000':'Enter SKU / code / alias, e.g. 3012 or RHL1000');
  if(INDEX){const t=(INDEX.dirs?INDEX.dirs.length:0)+(INDEX.files?INDEX.files.length:0);el.count.textContent=lang==='zh'?('已收录 '+t+' 条SKU/文件夹'):(t+' SKU items indexed');if(INDEX.builtAt)el.built.textContent=(lang==='zh'?'索引更新于 ':'Updated ')+INDEX.builtAt.slice(0,10);}
}
function applyTheme(){
  const t=document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';
  document.getElementById('themeIcon').textContent=t==='dark'?'☀️':'🌙';
  const lbl=document.querySelector('#themeBtn .ctl-label');if(lbl){lbl.dataset.zh=t==='dark'?'浅色':'深色';lbl.dataset.en=t==='dark'?'Light':'Dark';}
  applyLang();
}
document.getElementById('langBtn').addEventListener('click',()=>{const n=(document.documentElement.getAttribute('data-lang')||'zh')==='zh'?'en':'zh';document.documentElement.setAttribute('data-lang',n);localStorage.setItem('sku_lang',n);applyLang();});
document.getElementById('themeBtn').addEventListener('click',()=>{const n=(document.documentElement.getAttribute('data-theme')||'light')==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',n);localStorage.setItem('sku_theme',n);applyTheme();});
if(localStorage.getItem('sku_theme'))document.documentElement.setAttribute('data-theme',localStorage.getItem('sku_theme'));
if(localStorage.getItem('sku_lang'))document.documentElement.setAttribute('data-lang',localStorage.getItem('sku_lang'));

fetch('./index.json').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(d=>{INDEX=d;applyLang();el.q.focus();}).catch(err=>{INDEX=null;el.count.textContent='⚠️ 索引加载失败';el.meta.textContent='请确认 index.json 已发布。错误: '+err.message;});

function doSearch(){
  const q=el.q.value.trim();
  if(!INDEX){el.meta.textContent=lang==='zh'?'索引未加载，请稍候':'Index loading…';return;}
  if(!q){el.results.innerHTML='';el.meta.textContent='';return;}
  const needle=q.toUpperCase(),all=[];
  (INDEX.dirs||[]).forEach(d=>all.push({name:d.name,path:d.path,type:'dir'}));
  (INDEX.files||[]).forEach(f=>all.push({name:f.name,path:f.path,type:'file'}));
  const exact=[],prefix=[],contain=[];
  for(const e of all){const n=(e.name||'').toUpperCase();if(n===needle)exact.push(e);else if(n.startsWith(needle))prefix.push(e);else if(n.includes(needle))contain.push(e);}
  const data=[...exact.slice(0,30),...prefix.slice(0,60),...contain.slice(0,60)];
  el.meta.textContent=(lang==='zh'?'找到 ':'Found ')+data.length+(lang==='zh'?' 条':' results');
  if(!data.length){el.results.innerHTML='<div class="empty">'+(lang==='zh'?'未找到，试试更短的关键词或别的别名':'No results. Try shorter keyword.')+'</div>';return;}
  const dl=lang==='zh'?'目录':'Dir',fl=lang==='zh'?'文件':'File',cl=lang==='zh'?'复制':'Copy',ol=lang==='zh'?'打开':'Open';
  el.results.innerHTML=data.map(it=>{const isDir=it.type==='dir';return '<div class="item" data-path="'+escAttr(it.path)+'"><div class="name"><span class="tag '+(isDir?'dir':'file')+'">'+(isDir?dl:fl)+'</span>'+esc(it.name)+'</div><div class="path">'+esc(it.path)+'</div><div class="actions"><button class="primary act-copy"><span class="btntext">'+cl+'</span></button><button class="act-open"><span class="btntext">'+ol+'</span></button></div></div>';}).join('');
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function escAttr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function copyPath(btn,p){const dm=lang==='zh'?'已复制 ✓':'Copied ✓',em=lang==='zh'?'复制失败':'Copy failed';function fb(){try{const ta=document.createElement('textarea');ta.value=p;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);flash(btn,dm,'done');}catch(e){flash(btn,em,'err',2500);}}if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(p).then(()=>flash(btn,dm,'done')).catch(fb);else fb();}
function openPath(btn,p){const bm=lang==='zh'?'打开中…':'Opening…',dm=lang==='zh'?'已打开 ✓':'Opened ✓';const pu='sku-open://open?path='+encodeURIComponent(p);try{const iframe=document.createElement('iframe');iframe.style.display='none';iframe.src=pu;document.body.appendChild(iframe);flash(btn,bm,'busy',0);setTimeout(()=>flash(btn,dm,'done',0),1300);setTimeout(()=>flash(btn,null,'',0),2900);iframe.addEventListener('load',()=>setTimeout(()=>document.body.removeChild(iframe),2000));setTimeout(()=>{if(!window.__skuOpenInstalled){if(!window.__skuOpenAsked){window.__skuOpenAsked=true;if(confirm(lang==='zh'?'正在尝试打开文件。如果没反应，说明还没安装打开脚本。\n\n需要现在安装打开脚本吗？（仅需安装一次）':'Trying to open… If nothing happens, the opener is not installed. Install now? (once)'))window.location.href='./sku-open-installer-v2.zip';}}},1500);}catch(e){alert('打开失败: '+e.message);}}
function flash(btn,msg,state,duration){duration=(duration==null)?1500:duration;const te=btn.querySelector('.btntext');const setState=()=>{btn.classList.remove('state-done','state-busy','state-err','pulse-pop');if(state==='done')btn.classList.add('state-done');else if(state==='busy')btn.classList.add('state-busy');else if(state==='err')btn.classList.add('state-err');};const change=(html,cb)=>{btn.classList.add('fade-out');setTimeout(()=>{te.innerHTML=html;btn.classList.remove('fade-out');btn.classList.add('fade-in');btn.classList.add('pulse-pop');setTimeout(()=>btn.classList.remove('fade-in'),250);if(cb)cb();},180);};const restore=()=>{const orig=btn.classList.contains('act-copy')?(lang==='zh'?'复制':'Copy'):(lang==='zh'?'打开':'Open');btn.classList.add('fade-out');setTimeout(()=>{te.textContent=orig;btn.classList.remove('fade-out');btn.classList.add('fade-in');setTimeout(()=>btn.classList.remove('fade-in'),250);btn.classList.remove('state-done','state-busy','state-err','pulse-pop');},180);};if(msg===null){restore();return;}if(state==='busy'){setState();change('<span class="spinner"></span>'+msg);}else if(state==='done'||state==='err'){setState();change(msg);}if(duration>0)setTimeout(restore,duration);}
document.getElementById('results').addEventListener('click',function(e){const btn=e.target.closest('button');if(!btn)return;const item=btn.closest('.item');if(!item)return;const p=item.getAttribute('data-path');if(!p)return;if(btn.classList.contains('act-copy'))copyPath(btn,p);else if(btn.classList.contains('act-open'))openPath(btn,p);});
applyLang();applyTheme();
</script>
</body>
</html>
